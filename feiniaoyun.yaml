mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
external-controller: '127.0.0.1:9090'
secret: ''
unified-delay: true
tcp-concurrent: true
profile:
    store-selected: true
    store-fake-ip: true
sniffer:
    enable: true
    override-destination: false
    sniff: { HTTP: { ports: [80, 8080-8880] }, TLS: { ports: [443, 8443] }, QUIC: { ports: [443, 8443] } }
    skip-domain: ['Mijia Cloud', +.push.apple.com]
dns:
    enable: true
    ipv6: false
    respect-rules: true
    use-hosts: true
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
