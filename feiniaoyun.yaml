    proxy-server-nameserver: ['https://doh.pub/dns-query', 'https://dns.alidns.com/dns-query']
    direct-nameserver: ['https://doh.pub/dns-query', 'https://dns.alidns.com/dns-query']
    nameserver: ['https://doh.pub/dns-query', 'https://dns.alidns.com/dns-query']
    nameserver-policy: { 'rule-set:cn': ['https://doh.pub/dns-query', 'https://dns.alidns.com/dns-query'], 'rule-set:private': ['https://doh.pub/dns-query', 'https://dns.alidns.com/dns-query'], 'rule-set:proxy': ['https://dns.cloudflare.com/dns-query', 'https://dns.google/dns-query'] }
